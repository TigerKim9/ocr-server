<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR 서버 - 이미지 텍스트 추출</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 OCR 서버</h1>
            <p>이미지에서 텍스트를 추출합니다</p>
        </header>

        <main>
            <!-- 업로드 섹션 -->
            <section class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <p class="upload-text">이미지를 드래그하거나 클릭하여 업로드하세요</p>
                    <p class="upload-subtext">지원 형식: JPG, PNG, GIF, BMP</p>
                    <input type="file" id="fileInput" accept="image/*" hidden>
                </div>

                <div class="options">
                    <label for="langSelect">언어 선택:</label>
                    <select id="langSelect">
                        <option value="eng+kor">한글 + 영어</option>
                        <option value="kor">한글만</option>
                        <option value="eng">영어만</option>
                        <option value="jpn">일본어</option>
                        <option value="chi_sim">중국어 (간체)</option>
                        <option value="chi_tra">중국어 (번체)</option>
                    </select>

                    <label>
                        <input type="checkbox" id="detailedMode">
                        상세 모드 (단어별 정보)
                    </label>
                </div>

                <button id="processBtn" class="btn-primary" disabled>텍스트 추출</button>
            </section>

            <!-- 미리보기 섹션 -->
            <section class="preview-section" id="previewSection" style="display: none;">
                <h2>이미지 미리보기</h2>
                <img id="previewImage" alt="미리보기">
            </section>

            <!-- 결과 섹션 -->
            <section class="result-section" id="resultSection" style="display: none;">
                <h2>추출 결과</h2>

                <div class="result-info">
                    <div class="info-item">
                        <span class="info-label">파일명:</span>
                        <span id="resultFilename">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">언어:</span>
                        <span id="resultLanguage">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">신뢰도:</span>
                        <span id="resultConfidence">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">단어 수:</span>
                        <span id="resultWordCount">-</span>
                    </div>
                </div>

                <div class="result-text-container">
                    <div class="result-header">
                        <h3>추출된 텍스트</h3>
                        <button id="copyBtn" class="btn-secondary">📋 복사</button>
                    </div>
                    <textarea id="resultText" readonly></textarea>
                </div>

                <!-- 상세 결과 (상세 모드일 때만 표시) -->
                <div id="detailedResult" style="display: none;">
                    <h3>단어별 상세 정보</h3>
                    <div class="detailed-words" id="detailedWords"></div>
                </div>
            </section>

            <!-- 로딩 표시 -->
            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>이미지 처리 중...</p>
            </div>

            <!-- 에러 표시 -->
            <div class="error" id="error" style="display: none;">
                <div class="error-icon">⚠️</div>
                <p id="errorMessage"></p>
            </div>
        </main>

        <footer>
            <p>FastAPI + Tesseract OCR</p>
            <a href="/docs" target="_blank">API 문서 보기</a>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
